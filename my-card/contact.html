<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>beush3v — Контакты</title>
    <style>
        /* Стили для ошибок валидации */
        .form-group.error input,
        .form-group.error textarea {
            border-color: #f12711;
            background: #fff0f0;
        }

        .error-message {
            display: none;
            color: #f12711;
            font-size: 13px;
            font-weight: 500;
            margin-top: 5px;
        }

        .form-group.error .error-message {
            display: block;
        }

        .submit-button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <!-- ХЕДЕР СВЕРХУ -->
    <header>
        <nav class="main-nav">
            <a href="index.html" class="nav-link">Главная</a>
            <a href="about.html" class="nav-link">Обо мне</a>
            <a href="contact.html" class="nav-link active">Контакты</a>
        </nav>
    </header>

    <main>
        <div class="contact-container">
            <div class="contact-card">
                <div class="contact-header">
                    <h1>📬 Напишите мне</h1>
                    <p>Заполните форму, и я свяжусь с вами в ближайшее время</p>
                </div>

                <form class="contact-form" id="contactForm" action="https://formsubmit.co/beushvvv@gmail.com" method="POST">
                    <input type="text" name="_honey" style="display:none;">
                    <input type="hidden" name="_next" value="http://localhost:8080/my_new_project/thanks.html">
                    <input type="hidden" name="_subject" value="Новое сообщение с сайта!">
                    
                    <div class="form-group" id="nameGroup">
                        <label for="name">Ваше имя</label>
                        <input type="text" id="name" name="name" placeholder="Введите ваше имя" required>
                        <div class="error-message" id="nameError">
                            ⚠️ Это имя не разрешено. Пожалуйста, введите другое имя.
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="email">Ваш email</label>
                        <input type="email" id="email" name="email" placeholder="ivan@example.com" required>
                    </div>

                    <div class="form-group">
                        <label for="subject">Тема</label>
                        <select id="subject" name="subject">
                            <option value="cooperation">Сотрудничество</option>
                            <option value="question">Вопрос по сайту</option>
                            <option value="feedback">Отзыв</option>
                            <option value="other">Другое</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="message">Сообщение</label>
                        <textarea id="message" name="message" rows="5" placeholder="Напишите ваше сообщение здесь..." required></textarea>
                    </div>

                    <button type="submit" class="submit-button" id="submitBtn">📨 Отправить письмо</button>
                </form>

                <div class="contact-social">
                    <p>Или свяжитесь со мной в соцсетях:</p>
                    <div class="social-links">
                        <a href="https://vk.me/beushvvv" target="_blank" rel="noopener noreferrer" class="social-link">📱 VK</a>
                        <a href="https://t.me/beushvvv" target="_blank" rel="noopener noreferrer" class="social-link">💬 Telegram</a>
                        <a href="mailto:beushvvv@gmail.com" class="social-link">📧 Email</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 beush3v. Все права защищены.</p>
    </footer>

    <script>
        (function() {
            // Список запрещённых имён
            const forbiddenNames = [
                'beush3v', 'beushev', 'beushvv', 'beushvvv', 
                'benshvvv', 'bensh3v', 'benshvv', 'benshev'
            ];

            // Получаем элементы
            const form = document.getElementById('contactForm');
            const nameInput = document.getElementById('name');
            const nameGroup = document.getElementById('nameGroup');
            const nameError = document.getElementById('nameError');
            const submitBtn = document.getElementById('submitBtn');

            // Функция проверки имени
            function validateName(value) {
                const normalized = value.toLowerCase().trim();
                return !forbiddenNames.includes(normalized);
            }

            // Функция обновления состояния кнопки
            function updateSubmitButton() {
                const isValid = validateName(nameInput.value);
                submitBtn.disabled = !isValid;
                
                if (!isValid && nameInput.value.length > 0) {
                    nameGroup.classList.add('error');
                } else {
                    nameGroup.classList.remove('error');
                }
            }

            // Проверка при вводе
            nameInput.addEventListener('input', function() {
                updateSubmitButton();
            });

            // Проверка при потере фокуса
            nameInput.addEventListener('blur', function() {
                updateSubmitButton();
            });

            // Проверка при отправке
            form.addEventListener('submit', function(e) {
                const isValid = validateName(nameInput.value);
                
                if (!isValid) {
                    e.preventDefault(); // Отменяем отправку
                    nameGroup.classList.add('error');
                    nameInput.focus();
                    submitBtn.disabled = true;
                    
                    // Показываем сообщение об ошибке
                    alert('⚠️ Имя "' + nameInput.value + '" не разрешено.\nПожалуйста, введите другое имя.');
                }
            });

            // Инициализация (проверка при загрузке)
            updateSubmitButton();
        })();
    </script>
</body>
</html>
